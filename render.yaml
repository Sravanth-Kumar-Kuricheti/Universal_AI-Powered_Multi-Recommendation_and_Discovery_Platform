services:
  - type: web
    name: recomind-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:///./recomind.db
      - key: FRONTEND_URL
        value: https://recomind-ai.vercel.app
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
