services:
  # -------------------------------------------------------------
  # 1. RecoMind AI — Python FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: recomind-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./recomind.db
      - key: FRONTEND_URL
        value: https://recomind-ai.vercel.app
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. RecoMind AI — React Vite Frontend (Static Site on Render)
  # -------------------------------------------------------------
  - type: static
    name: recomind-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
