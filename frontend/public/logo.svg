<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C22F5" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#logoBg)" />
  
  <!-- Subtle border highlight -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="none" stroke="#C084FC" stroke-width="2" opacity="0.6" />

  <!-- Robot Head -->
  <!-- Antenna -->
  <circle cx="50" cy="22" r="5" fill="#38BDF8" filter="url(#glow)" />
  <rect x="48" y="24" width="4" height="10" rx="2" fill="#FFFFFF" />

  <!-- Ears / Earphones -->
  <rect x="20" y="44" width="6" height="16" rx="3" fill="#C084FC" />
  <rect x="74" y="44" width="6" height="16" rx="3" fill="#C084FC" />

  <!-- Head Base -->
  <rect x="24" y="32" width="52" height="40" rx="14" fill="url(#metalGrad)" />
  
  <!-- Visor Screen -->
  <rect x="29" y="38" width="42" height="26" rx="9" fill="url(#visorGrad)" />

  <!-- Glowing Robot Eyes / Waveform -->
  <ellipse cx="40" cy="50" rx="5" ry="6" fill="#38BDF8" filter="url(#glow)" />
  <ellipse cx="60" cy="50" rx="5" ry="6" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="41.5" cy="48.5" r="1.5" fill="#FFFFFF" />
  <circle cx="61.5" cy="48.5" r="1.5" fill="#FFFFFF" />

  <!-- Cute robot smile/mouth light -->
  <path d="M 44 57 Q 50 60 56 57" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#glow)" />
</svg>
